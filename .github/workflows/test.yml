name: Snipe-IT Automation Tests

# runs on every push to any branch, and on pull requests
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: checks out your code so the runner can access it
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: installs .NET 8 on the runner machine
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Step 3: restores NuGet packages
      - name: Restore dependencies
        run: dotnet restore

      # Step 4: builds the project
      - name: Build
        run: dotnet build --no-restore

      # Step 5: installs Playwright's Chromium browser on the runner
      - name: Install Playwright browsers
        run: pwsh bin/Debug/net8.0/playwright.ps1 install --with-deps chromium

      # Step 6: creates LoginData.txt from GitHub Secrets so credentials
      # are never stored in the repository
      - name: Create LoginData.txt
        run: |
          echo "${{ secrets.SNIPEIT_USERNAME }}" > LoginData.txt
          echo "${{ secrets.SNIPEIT_PASSWORD }}" >> LoginData.txt

      # Step 7: runs the tests in headless mode (no visible browser on a server)
      - name: Run tests
        run: dotnet test --no-build --logger "trx;LogFileName=results.xml"

      # Step 8: uploads the test results file so you can download and view it
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/*.xml"

      # Step 9: uploads the log files generated by TestLogger
      - name: Upload log files
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-logs
          path: "**/Logs/*.txt"