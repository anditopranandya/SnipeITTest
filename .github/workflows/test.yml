name: Snipe-IT Automation Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # caches the NuGet packages so they don't re-download every run
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-

      # caches the Playwright browser so it doesn't re-download every run
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('**/SnipeITTest.csproj') }}
          restore-keys: playwright-chromium-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Install Playwright browsers
        run: pwsh bin/Debug/net8.0/playwright.ps1 install --with-deps chromium

      - name: Create LoginData.txt
        run: |
          echo "${{ secrets.SNIPEIT_USERNAME }}" > LoginData.txt
          echo "${{ secrets.SNIPEIT_PASSWORD }}" >> LoginData.txt

      - name: Run tests
        run: dotnet test --no-build --logger "trx;LogFileName=results.xml"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/*.xml"

      - name: Upload log files
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-logs
          path: "**/Logs/*.txt"